<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylRings" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062114"/>
      <stop offset="90%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#vinylRings)"/>
  
  <!-- Subtle vinyl grooves -->
  <circle cx="300" cy="300" r="260" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.1"/>
  <circle cx="300" cy="300" r="220" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.08"/>
  <circle cx="300" cy="300" r="180" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.08"/>
  <circle cx="300" cy="300" r="140" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.1"/>

  <!-- Center Label -->
  <circle cx="300" cy="300" r="95" fill="#141417" stroke="#34d399" stroke-width="2"/>
  <circle cx="300" cy="300" r="15" fill="#000" stroke="#52525b" stroke-width="1.5"/>

  <!-- Typography on Cover -->
  <text x="40" y="90" font-family="'Syne', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">MILESTONES</text>
  <text x="42" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#34d399" letter-spacing="0.15em">A RETROSPECTIVE</text>
  
  <!-- Bottom serial mark -->
  <text x="40" y="550" font-family="monospace" font-size="12" fill="#71717a" letter-spacing="0.1em">BLUE NOTE RECORDS // STEREO LP-06018</text>
</svg>